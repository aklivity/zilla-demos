---
name: example
stores:
  cache:
    type: memory
guards:
  authn_jwt:
    type: jwt
    options:
      issuer: https://auth.example.com
      audience: https://api.example.com
      keys:
        - kty: RSA
          n: 
          e: AQAB
          alg: RS256
          kid: example
bindings:
  north_tcp_server:
    type: tcp
    kind: server
    options:
      host: 0.0.0.0
      port:
        - 7114
    routes:
      - when:
          - port: 7114
        exit: north_http_server
  north_http_server:
    type: http
    kind: server
    options:
      access-control:
        policy: cross-origin
    routes:
      - when:
          - headers:
              :scheme: http
              :path: /mcp
        exit: north_mcp_server
  north_mcp_server:
    type: mcp
    kind: server
    options:
      authorization:
        authn_jwt:
          credentials: "Bearer {credentials}"
    exit: north_mcp_proxy
    telemetry:
      metrics:
        - mcp.*
      attributes:
        method: ${mcp.method}
        tool: ${mcp.tool}
        outcome: ${mcp.outcome}
  north_mcp_proxy:
    type: mcp
    kind: proxy
    options:
      cache:
        store: cache
        ttl: PT5M
        authorization:
          authn_jwt:
            credentials: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6ImV4YW1wbGUifQ.eyJhdWQiOiJodHRwczovL2FwaS5leGFtcGxlLmNvbSIsImV4cCI6NDk0NDEwNTM0OSwiaXNzIjoiaHR0cHM6Ly9hdXRoLmV4YW1wbGUuY29tIiwic2NvcGUiOiJrYWZrYV9zcjp0b29scyBrYWZrYV9jb25uZWN0OnRvb2xzIGthZmthOnRvb2xzIn0.ksEgnVYk-EKTXy-DrigmXyLu_agg9IqqEsbzTWBB5fEU_bZrV9DMVBHIHXE17r6HTuvYYQZ4X8DZSrlKrnp0Kn9xlQBVRMeeKlfgk7eidtPyx0QkJt6yuhw4VQmpnii2i7ApAWVdEfX0u8x2kdSpP4fKtbMpO5OKv1f4clem6MAoCJdaK6-UgWmXnWWCeY_Xl5wYP61pk6PiKgQRdc2sygLSSo_Rye9huR0XrPeY1Vg3kDmR9RUuRJBGAAkfN8wf2u94afwZEPNLFRoyYqiqbY3al8tPoyEOQ-Y3zJwTd2JaJ0KlhP3fgAn4P3MF6bkroGPkwPqiAtrgdah63XxAQg"
        tools:
          eager:
            policy: explicit
            match:
              - everything__echo
              - urlelicit__authorize
              - github__create_pr
              - petstore__list_pets
              - petstore__search_pets
              - petstore__create_pet
              - kafka_sr__list_subjects
              - kafka_sr__register_schema
              - kafka__produce_message
              - kafka__consume_messages
              - kafka__create_topics
              - kafka__delete_topics
              - kafka__describe_topic_configs
              - kafka__describe_broker_configs
              - kafka__alter_topic_configs
              - kafka__alter_broker_configs
              - kafka__list_acls
              - kafka__create_acls
              - kafka__delete_acls
              - kafka__list_topics
              - kafka__describe_topic
              - kafka__cluster_overview
              - kafka__list_brokers
              - kafka__describe_cluster
              - kafka__list_consumer_groups
              - kafka__describe_consumer_group
              - kafka__describe_consumer_group_lag
              - kafka__reset_offsets
              - kafka_connect__list_connector_plugins
              - kafka_connect__list_connectors
              - kafka_connect__describe_connector
              - kafka_connect__create_connector
              - kafka_connect__delete_connector
          search:
            toolkit: zilla
    routes:
      - exit: south_mcp_client_everything
        when:
          - toolkit: everything
      - exit: south_mcp_schema_registry_client
        when:
          - toolkit: kafka_sr
        guarded:
          authn_jwt:
            - kafka_sr:tools
      - exit: south_mcp_kafka_connect_client
        when:
          - toolkit: kafka_connect
        guarded:
          authn_jwt:
            - kafka_connect:tools
      - exit: south_mcp_kafka_client
        when:
          - toolkit: kafka
        guarded:
          authn_jwt:
            - kafka:tools
  south_mcp_client_everything:
    type: mcp
    kind: client
    options:
      server: http://everything:3001/mcp
    exit: sys:http_client
  south_mcp_schema_registry_client:
    type: mcp-schema-registry
    kind: client
    options:
      server: http://karapace-registry:8081
    routes:
      - when:
          - tool: register_schema
        guarded:
          authn_jwt:
            - kafka_sr:write
      - when:
          - tool: "*"
  south_mcp_kafka_connect_client:
    type: mcp-kafka-connect
    kind: client
    options:
      server: http://kafka-connect:8083
    routes:
      - when:
          - tool: create_connector
          - tool: delete_connector
          - tool: update_connector_config
          - tool: restart_connector
          - tool: pause_connector
          - tool: resume_connector
          - tool: stop_connector
          - tool: restart_connector_task
          - tool: alter_connector_offsets
          - tool: reset_connector_offsets
        guarded:
          authn_jwt:
            - kafka_connect:admin
      - when:
          - tool: "*"
  south_mcp_kafka_client:
    type: mcp-kafka
    kind: client
    options:
      servers:
        - kafka.examples.dev:29092
    routes:
      - when:
          - tool: create_topics
          - tool: delete_topics
          - tool: alter_topic_configs
          - tool: alter_broker_configs
          - tool: reset_offsets
        guarded:
          authn_jwt:
            - kafka:admin
      - when:
          - tool: create_acls
          - tool: delete_acls
        guarded:
          authn_jwt:
            - kafka:acls
      - when:
          - tool: produce_message
            topics: [orders]
        guarded:
          authn_jwt:
            - kafka:write
      - when:
          - tool: consume_messages
            topics: [orders]
      - when:
          - tool: describe_topic_configs
          - tool: describe_broker_configs
          - tool: list_acls
          - tool: list_topics
          - tool: describe_topic
          - tool: cluster_overview
          - tool: list_brokers
          - tool: describe_cluster
          - tool: list_consumer_groups
          - tool: describe_consumer_group
          - tool: describe_consumer_group_lag
telemetry:
  metrics:
    - mcp.initialize
    - mcp.initialize.duration
    - mcp.tools.list
    - mcp.tools.list.duration
    - mcp.tools.call
    - mcp.tools.call.duration
    - mcp.prompts.list
    - mcp.prompts.list.duration
    - mcp.prompts.get
    - mcp.prompts.get.duration
    - mcp.resources.list
    - mcp.resources.list.duration
    - mcp.resources.read
    - mcp.resources.read.duration
  exporters:
    stdout_logs_exporter:
      type: stdout
    prometheus_exporter:
      type: prometheus
      options:
        endpoints:
          - scheme: http
            port: 7190
            path: /metrics

---
name: sys
bindings:
  http_client:
    type: http
    kind: client
    routes:
      - exit: tls_client
        when:
          - headers:
              ":scheme": https
      - exit: tcp_client
        when:
          - headers:
              ":scheme": http
  tcp_client:
    type: tcp
    kind: client
  tls_client:
    type: tls
    kind: client
    exit: tcp_client
